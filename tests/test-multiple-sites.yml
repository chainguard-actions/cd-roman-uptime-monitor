name: Test multiple sites monitoring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local git remote so action can push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git init --bare /tmp/fake-remote.git
          git remote set-url origin /tmp/fake-remote.git
          git push --set-upstream origin HEAD

      - id: action
        uses: .
        with:
          sites: |
            https://httpbin.org/status/200
            https://httpbin.org/status/201
            https://httpbin.org/status/204
          create-issue: "false"
          timeout: "30"
          success-codes: "200,201,202,204"

      - name: Assert total-sites is 3
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total-sites=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed-sites is 0
        env:
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed-sites=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file exists and has entries
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file not found at '$LOG_PATH'"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG_PATH"
          LINE_COUNT=$(wc -l < "$LOG_PATH")
          echo "Line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 1 ]; then
            echo "FAIL: expected log file to have at least 1 line"
            exit 1
          fi
          echo "PASS"
