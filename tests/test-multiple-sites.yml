name: Test multiple sites monitoring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git remote reachable for push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config push.default current
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          sites: |
            https://github.com
            https://api.github.com
            https://github.com/actions/checkout
          log-file: "multi-site-uptime.log"
          timeout: "30"
          success-codes: "200,201,202,204"
          max-concurrent: "5"
          create-issue: "false"

      - name: Assert total-sites is 3
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total-sites=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed-sites is a number
        env:
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if ! echo "$FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected failed-sites to be a number, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file exists and has entries
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file not found at '$LOG_PATH'"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG_PATH"
          # Log file should have content (at least one line)
          LINE_COUNT=$(wc -l < "$LOG_PATH")
          echo "Line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 1 ]; then
            echo "FAIL: log file is empty"
            exit 1
          fi
          echo "PASS"
