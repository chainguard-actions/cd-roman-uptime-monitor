name: Test multiple sites monitoring
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake git that no-ops push
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/git << 'EOF'
          #!/bin/sh
          if [ "$1" = "push" ]; then
            echo "[fake-git] Skipping push (test mode)"
            exit 0
          fi
          exec /usr/bin/git "$@"
          EOF
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          sites: |
            https://httpbin.org/status/200
            https://httpbin.org/status/201
          create-issue: "false"
          log-file: "tests/uptime-test-multi.log"
          timeout: "30"
          max-concurrent: "2"

      - name: Assert total-sites output is 2
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "actual total-sites: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected total-sites=2, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total-sites=2"

      - name: Assert failed-sites output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "actual failed-sites: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected failed-sites=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed-sites=0"

      - name: Assert log file contains both URLs
        run: |
          LOG="tests/uptime-test-multi.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: log file not found at $LOG"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG"
          if ! grep -q "httpbin.org/status/200" "$LOG"; then
            echo "FAIL: log file does not contain first URL"
            exit 1
          fi
          if ! grep -q "httpbin.org/status/201" "$LOG"; then
            echo "FAIL: log file does not contain second URL"
            exit 1
          fi
          echo "PASS: log file contains both URLs"
