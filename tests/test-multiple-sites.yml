name: Test multiple sites monitoring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git config and fake remote
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git config push.default current
          # Create a bare repo to act as the remote
          git init --bare /tmp/fake-remote.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/fake-remote.git
          # Push current branch to the fake remote and set upstream
          git push -u origin HEAD:act-harness
      - name: Start local HTTP servers
        run: |
          # Server 1: returns 200
          python3 -c "
          import http.server, socketserver

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'OK')
              def log_message(self, format, *args):
                  pass

          with socketserver.TCPServer(('', 8771), Handler) as httpd:
              httpd.serve_forever()
          " &

          # Server 2: returns 201
          python3 -c "
          import http.server, socketserver

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(201)
                  self.end_headers()
                  self.wfile.write(b'Created')
              def log_message(self, format, *args):
                  pass

          with socketserver.TCPServer(('', 8772), Handler) as httpd:
              httpd.serve_forever()
          " &

          # Server 3: returns 204
          python3 -c "
          import http.server, socketserver

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(204)
                  self.end_headers()
              def log_message(self, format, *args):
                  pass

          with socketserver.TCPServer(('', 8773), Handler) as httpd:
              httpd.serve_forever()
          " &

          # Wait for all servers to be ready
          for port in 8771 8772 8773; do
            for i in $(seq 1 10); do
              curl -sf http://localhost:$port/ -o /dev/null && break
              sleep 1
            done
          done
          echo "All servers ready"
      - id: action
        uses: .
        with:
          sites: |
            http://localhost:8771/
            http://localhost:8772/
            http://localhost:8773/
          create-issue: "false"
          timeout: "10"
          max-concurrent: "3"
        env:
          GITHUB_TOKEN: dummy-token
      - name: Assert total-sites is 3
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total-sites to be '3', got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed-sites is 0 (all success codes)
        env:
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed-sites to be '0', got '$FAILED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert log file exists and has content
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file not found at '$LOG_PATH'"
            exit 1
          fi
          LINE_COUNT=$(wc -l < "$LOG_PATH")
          echo "Log file has $LINE_COUNT lines"
          if [ "$LINE_COUNT" -lt 1 ]; then
            echo "FAIL: log file is empty"
            exit 1
          fi
          echo "PASS"
          cat "$LOG_PATH"
