name: Test multiple sites monitoring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local git remote for push
        run: |
          git init --bare /tmp/bare-repo.git
          git remote set-url origin /tmp/bare-repo.git || git remote add origin /tmp/bare-repo.git
          git config user.email "test@test.com"
          git config user.name "Test"
          git push --set-upstream origin HEAD
      - id: monitor
        uses: .
        with:
          sites: |
            https://example.com
            https://example.org
            https://example.net
          create-issue: "false"
          max-concurrent: "3"
        env:
          GITHUB_TOKEN: fake-token-not-needed
      - name: Assert total-sites is 3
        env:
          TOTAL: ${{ steps.monitor.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total-sites to be '3', got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed-sites output is numeric
        env:
          FAILED: ${{ steps.monitor.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if ! echo "$FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected failed-sites to be a non-negative integer, got '$FAILED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert log file exists
        env:
          LOG_PATH: ${{ steps.monitor.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ -z "$LOG_PATH" ]; then
            echo "FAIL: log-file-path output is empty"
            exit 1
          fi
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file does not exist at '$LOG_PATH'"
            exit 1
          fi
          echo "PASS"
