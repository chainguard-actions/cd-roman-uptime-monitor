name: Test failure detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git remote reachable for push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git push --set-upstream origin HEAD:act-harness

      - id: action
        uses: .
        with:
          sites: |
            https://httpbin.org/status/404
          log-file: tests/uptime-test-failure.log
          create-issue: "false"
          timeout: "30"
          success-codes: "200,201,202,204"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert total-sites is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total-sites=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed-sites is 1
        env:
          ACTUAL: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected failed-sites=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file records the failure
        run: |
          LOG="$GITHUB_WORKSPACE/tests/uptime-test-failure.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: log file not found at $LOG"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG"
          if ! grep -q "httpbin.org/status/404" "$LOG"; then
            echo "FAIL: log file does not contain the monitored URL"
            exit 1
          fi
          echo "PASS"
