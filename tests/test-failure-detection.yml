name: Test failure detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local git remote so push succeeds
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git init --bare /tmp/remote-repo.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/remote-repo.git
          git push --set-upstream origin HEAD:act-harness

      - id: action
        uses: .
        with:
          sites: "https://httpbin.org/status/503"
          create-issue: "false"
          log-file: "failure-detection-uptime.log"
          timeout: "10"
          success-codes: "200,201,202,204"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert total-sites is 1
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "1" ]; then
            echo "FAIL: expected total-sites to be '1', got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed-sites is 1 (503 should be a failure)
        env:
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed-sites to be '1', got '$FAILED'"
            exit 1
          fi
          echo "PASS: correctly detected 1 failed site"

      - name: Assert log file was created
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking for log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file not found at $LOG_PATH"
            exit 1
          fi
          echo "PASS: log file exists"
          cat "$LOG_PATH"
