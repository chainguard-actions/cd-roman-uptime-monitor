name: Test no valid sites provided
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          sites: |
            not-a-valid-url
            also-not-valid
            ftp://wrong-scheme.com
          create-issue: "false"
          log-file: "tests/uptime-invalid.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with no valid sites"
            exit 1
          fi
          echo "PASS: action correctly failed with no valid sites"

      - name: Assert no outputs set
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "total-sites: '$TOTAL'"
          echo "failed-sites: '$FAILED'"
          if [ -n "$TOTAL" ] || [ -n "$FAILED" ]; then
            echo "FAIL: expected no outputs when no valid sites provided"
            exit 1
          fi
          echo "PASS: no outputs set as expected"
