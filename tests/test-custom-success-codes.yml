name: Test custom success codes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake git that no-ops push
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/git << 'EOF'
          #!/bin/sh
          if [ "$1" = "push" ]; then
            echo "[fake-git] Skipping push (test mode)"
            exit 0
          fi
          exec /usr/bin/git "$@"
          EOF
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          sites: "https://httpbin.org/status/404"
          create-issue: "false"
          log-file: "tests/uptime-test-custom-codes.log"
          success-codes: "200,201,202,204,404"
          timeout: "30"

      - name: Assert total-sites output is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "actual total-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total-sites=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total-sites=1"

      - name: Assert failed-sites is 0 because 404 is in success-codes
        env:
          ACTUAL: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "actual failed-sites: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected failed-sites=0 (404 is in success-codes), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed-sites=0 (404 treated as success)"

      - name: Assert log file contains the URL
        run: |
          LOG="tests/uptime-test-custom-codes.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: log file not found at $LOG"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG"
          if ! grep -q "httpbin.org/status/404" "$LOG"; then
            echo "FAIL: log file does not contain expected URL"
            exit 1
          fi
          echo "PASS: log file contains expected URL"
