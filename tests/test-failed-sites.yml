name: Test failed sites detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake git that no-ops push
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/git << 'EOF'
          #!/bin/sh
          if [ "$1" = "push" ]; then
            echo "[fake-git] Skipping push (test mode)"
            exit 0
          fi
          exec /usr/bin/git "$@"
          EOF
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          sites: "https://httpbin.org/status/500"
          create-issue: "false"
          log-file: "tests/uptime-test-failed.log"
          timeout: "30"
        # The action itself succeeds (exit 0) even when sites fail;
        # it only sets the failed-sites output count

      - name: Assert total-sites output is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "actual total-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total-sites=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total-sites=1"

      - name: Assert failed-sites output is 1
        env:
          ACTUAL: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "actual failed-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected failed-sites=1 (500 is not a success code), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed-sites=1"

      - name: Assert log file contains the failed URL
        run: |
          LOG="tests/uptime-test-failed.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: log file not found at $LOG"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG"
          if ! grep -q "httpbin.org/status/500" "$LOG"; then
            echo "FAIL: log file does not contain expected URL"
            exit 1
          fi
          if ! grep -q "Status: 500" "$LOG"; then
            echo "FAIL: log file does not show status 500"
            exit 1
          fi
          echo "PASS: log file records the failed site with status 500"
