name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local git remote for push
        run: |
          git init --bare /tmp/bare-repo.git
          git remote set-url origin /tmp/bare-repo.git || git remote add origin /tmp/bare-repo.git
          git config user.email "test@test.com"
          git config user.name "Test"
          git push --set-upstream origin HEAD
      - id: monitor
        uses: .
        with:
          sites: |
            https://example.com
          timezone: "America/New_York"
          log-file: "custom-uptime.log"
          timeout: "10"
          success-codes: "200,201,204"
          max-concurrent: "2"
          create-issue: "false"
        env:
          GITHUB_TOKEN: fake-token-not-needed
      - name: Assert log-file-path matches custom path
        env:
          LOG_PATH: ${{ steps.monitor.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ -z "$LOG_PATH" ]; then
            echo "FAIL: log-file-path output is empty"
            exit 1
          fi
          if [[ "$LOG_PATH" != *"custom-uptime.log"* ]]; then
            echo "FAIL: expected log-file-path to contain 'custom-uptime.log', got '$LOG_PATH'"
            exit 1
          fi
          echo "PASS"
      - name: Assert total-sites is 1
        env:
          TOTAL: ${{ steps.monitor.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "1" ]; then
            echo "FAIL: expected total-sites to be '1', got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom log file exists on disk
        env:
          LOG_PATH: ${{ steps.monitor.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: custom log file not found at '$LOG_PATH'"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG_PATH"
          echo "PASS"
