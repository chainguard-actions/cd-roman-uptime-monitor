name: Test custom options - timezone, success-codes, commit-message
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8081 --directory /tmp &
          echo $! > /tmp/http-server.pid
          # Wait for server to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "HTTP server ready"
              break
            fi
            sleep 1
          done

      - name: Set up git identity and local remote for git push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git push --set-upstream origin HEAD:act-harness

      - id: action
        uses: .
        with:
          sites: "http://localhost:8081/"
          timezone: "America/New_York"
          log-file: "tests/uptime-custom.log"
          commit-message: "chore: uptime check results"
          timeout: "20"
          success-codes: "200,201,202,204,301,302"
          max-concurrent: "2"
          create-issue: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert total-sites output
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "actual total-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total-sites=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total-sites=1"

      - name: Assert log-file-path output
        env:
          ACTUAL: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "actual log-file-path: $ACTUAL"
          if [ "$ACTUAL" != "tests/uptime-custom.log" ]; then
            echo "FAIL: expected log-file-path='tests/uptime-custom.log', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: log-file-path correct"

      - name: Assert log file exists and has content
        run: |
          if [ ! -f "tests/uptime-custom.log" ]; then
            echo "FAIL: log file not found"
            exit 1
          fi
          echo "Log file contents:"
          cat tests/uptime-custom.log
          if ! grep -q "localhost:8081" tests/uptime-custom.log; then
            echo "FAIL: log file does not contain the monitored URL"
            exit 1
          fi
          echo "PASS: log file exists and contains URL"

      - name: Assert failed-sites output is set (numeric)
        env:
          ACTUAL: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "actual failed-sites: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: failed-sites is not a number: '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed-sites is a valid number: $ACTUAL"

      - name: Stop local HTTP server
        if: always()
        run: |
          if [ -f /tmp/http-server.pid ]; then
            kill $(cat /tmp/http-server.pid) 2>/dev/null || true
          fi
