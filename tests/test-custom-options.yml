name: Test custom options
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and remote for push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git fetch origin
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || \
            git branch -u origin/act-harness 2>/dev/null || true

      - id: action
        uses: .
        with:
          sites: |
            https://example.com
            https://httpbin.org/status/200
          log-file: tests/uptime-custom.log
          timezone: "America/New_York"
          timeout: "20"
          success-codes: "200,201,202,204,301,302"
          max-concurrent: "2"
          create-issue: "false"
          commit-message: "test: uptime check custom"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert total-sites is 2
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "2" ]; then
            echo "FAIL: expected total-sites=2, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log-file-path output
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ "$LOG_PATH" != "tests/uptime-custom.log" ]; then
            echo "FAIL: expected log-file-path='tests/uptime-custom.log', got '$LOG_PATH'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file contains both URLs
        run: |
          LOG="tests/uptime-custom.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: log file '$LOG' was not created"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG"
          if ! grep -q "https://example.com" "$LOG"; then
            echo "FAIL: log file does not contain 'https://example.com'"
            exit 1
          fi
          echo "PASS"
