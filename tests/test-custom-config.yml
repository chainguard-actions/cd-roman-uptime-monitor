name: Test custom configuration options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local git remote for push
        run: |
          git init --bare /tmp/remote.git
          # Remove existing origin if present, then add our local bare repo
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/remote.git
          # Push current HEAD and set upstream tracking so 'git push' works without args
          git push --set-upstream origin HEAD
      - id: action
        uses: .
        with:
          sites: |
            https://example.com
          timezone: "America/New_York"
          log-file: "custom-uptime.log"
          timeout: "10"
          success-codes: "200,201,202,204,301,302"
          max-concurrent: "2"
          create-issue: "false"
        env:
          GITHUB_TOKEN: dummy-token
      - name: Assert log-file-path matches custom path
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ -z "$LOG_PATH" ]; then
            echo "FAIL: log-file-path output is empty"
            exit 1
          fi
          if [[ "$LOG_PATH" != *"custom-uptime.log"* ]]; then
            echo "FAIL: expected log-file-path to contain 'custom-uptime.log', got '$LOG_PATH'"
            exit 1
          fi
          echo "PASS"
      - name: Assert total-sites is 1
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "1" ]; then
            echo "FAIL: expected total-sites to be '1', got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom log file was created
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: custom log file not found at $LOG_PATH"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG_PATH"
          echo "PASS"
