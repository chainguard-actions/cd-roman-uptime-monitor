name: Test custom configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local git remote for act compatibility
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Create a bare repo to act as the remote
          git init --bare /tmp/remote-repo.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/remote-repo.git
          # Push and set upstream tracking so bare `git push` works in the action
          git push -u origin HEAD

      - id: action
        uses: .
        with:
          sites: |
            https://httpbin.org/status/200
          create-issue: "false"
          log-file: "custom-logs/my-uptime.log"
          timezone: "America/New_York"
          commit-message: "Custom commit message"
          timeout: "10"
          success-codes: "200"
          max-concurrent: "1"

      - name: Assert log-file-path matches custom path
        env:
          ACTUAL: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "log-file-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected log-file-path to be non-empty"
            exit 1
          fi
          # The path should contain our custom log file name
          if ! echo "$ACTUAL" | grep -q "my-uptime.log"; then
            echo "FAIL: expected log-file-path to contain 'my-uptime.log', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert total-sites is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total-sites to be '1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file exists at custom path
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: log file not found at '$LOG_PATH'"
            exit 1
          fi
          echo "PASS: log file exists at custom path"
          cat "$LOG_PATH"
