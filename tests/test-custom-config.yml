name: Test custom configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git remote reachable for push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config push.default current
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || true

      - id: action
        uses: .
        with:
          sites: "https://github.com"
          timezone: "America/New_York"
          log-file: "custom-uptime.log"
          commit-message: "test: uptime check"
          timeout: "30"
          success-codes: "200,201,202,204"
          max-concurrent: "3"
          create-issue: "false"

      - name: Assert log-file-path matches custom path
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "log-file-path: $LOG_PATH"
          if [ -z "$LOG_PATH" ]; then
            echo "FAIL: expected log-file-path to be set"
            exit 1
          fi
          # The log file path should contain the custom filename
          if ! echo "$LOG_PATH" | grep -q "custom-uptime.log"; then
            echo "FAIL: expected log-file-path to contain 'custom-uptime.log', got '$LOG_PATH'"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom log file exists
        env:
          LOG_PATH: ${{ steps.action.outputs.log-file-path }}
        run: |
          echo "Checking log file at: $LOG_PATH"
          if [ ! -f "$LOG_PATH" ]; then
            echo "FAIL: custom log file not found at '$LOG_PATH'"
            exit 1
          fi
          echo "Log file contents:"
          cat "$LOG_PATH"
          echo "PASS"

      - name: Assert total-sites is 1
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "1" ]; then
            echo "FAIL: expected total-sites=1, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
