name: Test invalid URLs handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          sites: |
            not-a-valid-url
            also-not-valid
          log-file: tests/uptime-test-invalid.log
          create-issue: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed due to no valid sites
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid URLs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with no valid URLs"
