name: Test failed site detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake git to intercept push
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/git << 'EOF'
          #!/bin/sh
          if [ "$1" = "push" ]; then
            echo "Fake git push: skipping actual push"
            exit 0
          fi
          exec /usr/bin/git "$@"
          EOF
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          sites: |
            https://httpbin.org/status/200
            https://httpbin.org/status/503
          create-issue: "false"
          log-file: "tests/uptime-failed.log"
          timeout: "10"
          success-codes: "200,201,202,204"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert log file was created
        run: |
          if [ ! -f "tests/uptime-failed.log" ]; then
            echo "FAIL: log file was not created"
            exit 1
          fi
          echo "PASS: log file exists"
          cat tests/uptime-failed.log

      - name: Assert total-sites output is 2
        env:
          TOTAL: ${{ steps.action.outputs.total-sites }}
        run: |
          echo "total-sites: $TOTAL"
          if [ "$TOTAL" != "2" ]; then
            echo "FAIL: expected total-sites=2, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed-sites output is 1
        env:
          FAILED: ${{ steps.action.outputs.failed-sites }}
        run: |
          echo "failed-sites: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed-sites=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert log file contains both site entries
        run: |
          if ! grep -q "httpbin.org" tests/uptime-failed.log; then
            echo "FAIL: log file does not contain expected site entries"
            cat tests/uptime-failed.log
            exit 1
          fi
          echo "PASS: log file contains site entries"
