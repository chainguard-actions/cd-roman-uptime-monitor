name: Test invalid URL handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          sites: "not-a-valid-url"
          log-file: "tests/uptime-invalid.log"
          create-issue: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed due to invalid URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid URL, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid URL"
